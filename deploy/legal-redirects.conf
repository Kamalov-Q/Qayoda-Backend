# Redirect the old legal pages to the website.
#
#   include /etc/nginx/snippets/legal-redirects.conf;   inside the
#                                                       api.growencity.uz
#                                                       server block
#
# ── Why ────────────────────────────────────────────────────────────────────
#
# /legal/*.html are static files the API's nginx has served since before the
# website existed. The website now has real pages for the same three
# documents, so there were two copies of the same legal text with nothing
# keeping them in step — and they drifted within weeks, with the static files
# carrying the current contact details while the maintained website pages
# carried the old ones.
#
# Deleting the files is the wrong fix. An app build already in someone's
# pocket still opens them, a store listing may still point at them, and a
# privacy policy that 404s is a rejected submission. A redirect keeps every
# old link working and leaves exactly one copy of the text.
#
# ── 301, not 302 ───────────────────────────────────────────────────────────
#
# The move is permanent and the old URLs should stop being indexed. A 302
# tells Google to keep the old URL in the index, which is how you end up with
# an api. subdomain outranking the site for your own privacy policy.
#
# Note these are served from api.growencity.uz, so they are cross-ORIGIN
# redirects to growencity.uz. That is fine for a browser following a link —
# it is a navigation, not a fetch, so CORS does not apply.

# Uzbek lived at the root of /legal/.
location = /legal/privacy.html          { return 301 https://growencity.uz/uz/privacy; }
location = /legal/offer.html            { return 301 https://growencity.uz/uz/terms; }
location = /legal/delete-account.html   { return 301 https://growencity.uz/uz/account-deletion; }

# Russian lived under /legal/ru/. The website puts the language first for
# BOTH languages, which is the part that silently breaks if you map these by
# hand and forget that the old layout was asymmetric.
location = /legal/ru/privacy.html        { return 301 https://growencity.uz/ru/privacy; }
location = /legal/ru/offer.html          { return 301 https://growencity.uz/ru/terms; }
location = /legal/ru/delete-account.html { return 301 https://growencity.uz/ru/account-deletion; }

# Anything else under /legal/ — an index page, a file that was renamed once,
# a link somebody typed from memory. Privacy is the document people are
# actually looking for, and it is the one the stores require.
location ^~ /legal/ru/ { return 301 https://growencity.uz/ru/privacy; }
location ^~ /legal/    { return 301 https://growencity.uz/uz/privacy; }
location = /legal      { return 301 https://growencity.uz/uz/privacy; }
