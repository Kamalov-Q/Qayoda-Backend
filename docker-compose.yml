services:
  postgres:
    image: postgis/postgis:17-3.5-alpine
    container_name: uynest-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: uynest
      POSTGRES_PASSWORD: uynest
      POSTGRES_DB: uynest
    ports:
      - '5433:5432'
    volumes:
      - uynest-pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U uynest -d uynest']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  uynest-pgdata:
